<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Halaman tidak ditemukan — HILOS</title>
<meta name="theme-color" content="#0E4F8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* Halaman ini bisa dibuka dari alamat apa saja, jadi semua alamat dihitung dari folder situs (mis. /HILOS/ di GitHub Pages, atau / di domain sendiri). */
  var ROOT = location.pathname.indexOf('/HILOS/') === 0 ? '/HILOS/' : '/';
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 55%,#2290D6 0%,#1264AC 50%,#0E4F8C 100%);color:#eaf1f8;font-family:'Inter',system-ui,sans-serif;overflow-x:hidden;}
  .top{padding:20px clamp(20px,5vw,64px);border-bottom:1px solid rgba(234,241,248,.14);background:#0E4F8C;}
  .top a{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:.14em;font-size:20px;color:#eaf1f8;text-decoration:none;}
  main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 20px;overflow:hidden;}
  .ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(120px,30vw,420px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(234,241,248,.07);white-space:nowrap;pointer-events:none;user-select:none;}
  .box{position:relative;max-width:520px;}
  .code{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8fdcff;display:inline-flex;align-items:center;gap:12px;}
  .code::before,.code::after{content:"";width:28px;height:2px;background:#8fdcff;}
  h1{margin-top:14px;font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(30px,6vw,52px);line-height:1.05;text-transform:uppercase;}
  p{margin-top:14px;color:rgba(234,241,248,.78);line-height:1.65;font-size:15px;}
  .btns{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-block;padding:14px 26px;font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid transparent;transition:transform .2s,background .2s,border-color .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn-fill{background:linear-gradient(135deg,#3FCBF6,#29B4EC);color:#06335C;}
  .btn-line{border-color:rgba(234,241,248,.5);color:#eaf1f8;}
  .btn-line:hover{border-color:#eaf1f8;}
  .btn:focus-visible{outline:3px solid #6fa3d4;outline-offset:3px;}
  footer{padding:20px;text-align:center;font-size:12px;color:rgba(234,241,248,.55);background:#0E4F8C;border-top:1px solid rgba(234,241,248,.14);}
  @media (prefers-reduced-motion:no-preference){ .box{animation:in .6s cubic-bezier(.2,.7,.2,1) both;} @keyframes in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}} }
</style>
</head>
<body>
<div class="top"><a id="home" href="/"><img src="/assets/logo-hilos-putih.png" alt="HILOS" style="height:40px;width:auto;display:block;"></a></div>
<main>
  <div class="ghost" aria-hidden="true">404</div>
  <div class="box">
    <div class="code">Error 404</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda buka tidak ada atau sudah dipindahkan. Silakan kembali ke beranda atau lihat koleksi produk kami.</p>
    <div class="btns">
      <a class="btn btn-fill" id="goHome" href="/">Ke Beranda</a>
      <a class="btn btn-line" id="goProduk" href="/produk.html">Lihat Produk</a>
      <a class="btn btn-line" id="goKontak" href="/kontak.html">Hubungi Kami</a>
    </div>
  </div>
</main>
<footer>© 2026 HILOS. All Rights Reserved.</footer>
<script>
  document.getElementById('home').href = ROOT;
  document.getElementById('goHome').href = ROOT;
  document.getElementById('goProduk').href = ROOT + 'produk.html';
  document.getElementById('goKontak').href = ROOT + 'kontak.html';
</script>
</body>
</html>
